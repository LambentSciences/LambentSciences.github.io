<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="beamTop" gradientUnits="userSpaceOnUse" x1="4" y1="16" x2="90" y2="78">
      <stop offset="0" stop-color="#8f0d18"/>
      <stop offset="0.5" stop-color="#e3282f"/>
      <stop offset="1" stop-color="#b3121d"/>
    </linearGradient>
    <linearGradient id="beamBottom" gradientUnits="userSpaceOnUse" x1="4" y1="16" x2="90" y2="78">
      <stop offset="0" stop-color="#6e0912"/>
      <stop offset="0.5" stop-color="#b5141e"/>
      <stop offset="1" stop-color="#8a0c16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50" cy="50" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd7c2"/>
      <stop offset="0.35" stop-color="#ff5a3c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx="86" cy="76" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2b8"/>
      <stop offset="0.45" stop-color="#ff4a2e"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#ffffff"/>
  <!-- hexagon frame -->
  <polygon points="50,16 79.5,33 79.5,67 50,84 20.5,67 20.5,33" fill="none" stroke="#a3121e" stroke-width="6" stroke-linejoin="miter"/>
  <!-- inner ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#a3121e" stroke-width="4"/>
  <!-- beam (two-tone faceted diamond) -->
  <polygon points="6,18 54.7,43.5 86,76" fill="url(#beamTop)"/>
  <polygon points="6,18 45.3,56.5 86,76" fill="url(#beamBottom)"/>
  <line x1="10" y1="20.8" x2="82" y2="73" stroke="#ffc4ad" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="50" cy="50" r="14" fill="url(#glow)"/>
  <!-- spark at beam tip -->
  <circle cx="86" cy="76" r="9" fill="url(#spark)"/>
  <polygon points="86,67.5 88,73.5 94.5,76 88,78.5 86,84.5 84,78.5 77.5,76 84,73.5" fill="#e3282f"/>
  <circle cx="86" cy="76" r="2.4" fill="#ffe2b8"/>
</svg>
